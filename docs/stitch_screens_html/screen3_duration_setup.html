<!-- BottomNavBar (Hidden on md as this is a setup flow, but keeping for structural consistency if needed, though strictly it should be suppressed in transactional flows. Leaving out per instructions for transactional/linear screens). -->
<script>
        function selectCard(clickedCard) {
            // Remove 'selected' class and reset icon colors from all cards
            const cards = document.querySelectorAll('.selection-card');
            cards.forEach(card => {
                card.classList.remove('selected');
                const icon = card.querySelector('.card-icon');
                if(icon) {
                    icon.classList.remove('text-primary');
                    icon.classList.add('text-on-surface-variant');
                }
            });

            // Add 'selected' class to the clicked card
            clickedCard.classList.add('selected');
            const clickedIcon = clickedCard.querySelector('.card-icon');
            if(clickedIcon) {
                clickedIcon.classList.remove('text-on-surface-variant');
                // The CSS will handle the primary color when selected
            }
        }
    </script>
