<script>
        // Simple script to handle exclusive selection of cards for visual demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.card-asymmetric');
            
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Remove focus state from all (handled implicitly by focus but good to enforce visual state if clicking elsewhere)
                    cards.forEach(c => c.blur());
                    card.focus();
                });
            });
            
            // Auto-focus the first one to show the active state
            if(cards.length > 0) {
                cards[0].focus();
            }
        });
