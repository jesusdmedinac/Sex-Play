<style>
        /* Asymmetric Card Radii */
        .card-asymmetric {
            border-radius: 32px 12px 32px 12px;
        }
        
        /* Interactive selection morph */
        .selection-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .selection-card.selected {
            background-color: theme('colors.primary-container');
            color: theme('colors.on-primary-container');
            box-shadow: inset 0 0 0 1px theme('colors.primary'), 0 8px 32px -8px rgba(253, 78, 135, 0.3);
            transform: scale(0.98);
        }
        
        .selection-card.selected .material-symbols-outlined {
            color: theme('colors.on-primary-container');
            font-variation-settings: 'FILL' 1;
        }
        
        .selection-card.selected .subtext {
            color: theme('colors.on-primary-container');
            opacity: 0.8;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 px-margin-mobile flex items-center justify-between h-16 bg-surface dark:bg-surface shadow-sm">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150 p-2 -ml-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary-container focus:bg-surface-low">
<span class="material-symbols-outlined text-3xl">menu</span>
</button>
<div class="font-display-lg text-headline-lg-mobile text-primary tracking-tighter">Eros &amp; Ember</div>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150 p-2 -mr-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary-container focus:bg-surface-low">
<span class="material-symbols-outlined text-3xl">favorite</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile pt-24 pb-32 max-w-lg mx-auto w-full">
<!-- Typography Anchor -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary-container mb-lg text-center mt-md px-4 leading-tight drop-shadow-md">
            ¿Dónde van a jugar hoy?
        </h1>
<!-- Selection Cards (Bento/Asymmetric Style) -->
<div class="flex flex-col gap-md">
<!-- Card 1 -->
<button class="selection-card card-asymmetric bg-surface-container-high border border-outline-variant p-md flex flex-col items-center justify-center gap-xs relative overflow-hidden group hover:bg-surface-highest focus:outline-none focus:ring-2 focus:ring-primary-container" id="card-local" onclick="selectCard('local')">
<div class="absolute inset-0 bg-gradient-to-br from-primary-container/0 to-primary-container/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-[48px] text-primary mb-2 transition-colors">smartphone</span>
<span class="font-title-md text-title-md text-on-surface">En Persona</span>
<span class="subtext font-body-md text-body-md text-on-surface-variant">(Mismo Dispositivo)</span>
</button>
<!-- Card 2 -->
<button class="selection-card card-asymmetric bg-surface-container-high border border-outline-variant p-md flex flex-col items-center justify-center gap-xs relative overflow-hidden group hover:bg-surface-highest focus:outline-none focus:ring-2 focus:ring-primary-container" id="card-remote" onclick="selectCard('remote')">
<div class="absolute inset-0 bg-gradient-to-br from-primary-container/0 to-primary-container/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-[48px] text-primary mb-2 transition-colors">wifi</span>
<span class="font-title-md text-title-md text-on-surface">Modo a Distancia / Remoto</span>
<span class="subtext font-body-md text-body-md text-on-surface-variant text-center">(Sin contacto presencial)</span>
</button>
</div>
<div class="flex-grow"></div> <!-- Spacer for bottom navigation alignment -->
</main>
<!-- Contextual Action Bar (Replaces bottom nav for linear flow) -->
<div class="fixed bottom-0 w-full bg-surface-container/90 backdrop-blur-xl border-t border-surface-container-highest px-margin-mobile py-4 z-40 pb-safe">
<div class="max-w-lg mx-auto flex items-center justify-between gap-4">
<button class="font-label-lg text-label-lg px-6 py-3 rounded-full border-2 border-outline-variant text-on-surface-variant hover:bg-surface-low hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-outline-variant active:scale-95 duration-200">
                Atrás
            </button>
<button class="font-label-lg text-label-lg px-8 py-3 rounded-full bg-surface-variant text-on-surface-variant opacity-50 cursor-not-allowed transition-all duration-300 focus:outline-none flex-grow" disabled="" id="btn-next">
                Siguiente
            </button>
</div>
</div>
<!-- Script for Selection Logic -->
<script>
        function selectCard(cardId) {
            // Reset both cards
            document.getElementById('card-local').classList.remove('selected');
            document.getElementById('card-remote').classList.remove('selected');
            
            // Select the clicked card
            document.getElementById('card-' + cardId).classList.add('selected');
            
            // Enable the 'Siguiente' button
            const nextBtn = document.getElementById('btn-next');
            nextBtn.disabled = false;
            nextBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
            nextBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'hover:bg-primary', 'active:scale-95', 'shadow-lg', 'shadow-primary-container/30');
            
            // Haptic feedback simulation (if supported)
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        }
    </script>
