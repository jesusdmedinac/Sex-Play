<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .limit-card.selected {
            background-color: rgba(253, 78, 135, 0.1);
            border-color: theme('colors.primary-container');
        }
        .limit-card.selected .check-icon {
            opacity: 1;
            transform: scale(1);
        }
        .limit-card .check-icon {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glow-effect {
            box-shadow: inset 0 0 0 1px rgba(255, 177, 194, 0.1);
        }
    </style>

    body {

<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Header Section -->
<header class="pt-12 px-margin-mobile pb-6 flex flex-col items-center text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">¿Límites a excluir?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">(Opcional)</p>
</header>
<!-- Main Content: Limit Selection Cards -->
<main class="flex-grow px-margin-mobile flex flex-col gap-sm overflow-y-auto pb-32">
<!-- Card 1 -->
<button class="limit-card w-full text-left bg-surface-container-low border border-surface-variant rounded-xl p-6 flex items-center justify-between transition-all duration-300 hover:bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-primary-container glow-effect active:scale-[0.98]">
<div class="flex flex-col gap-1">
<span class="font-title-md text-title-md text-on-surface">Juegos de Temperatura</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Hielo, cera, o variaciones térmicas.</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center shrink-0 check-container relative">
<span class="material-symbols-outlined text-primary-container check-icon absolute" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Card 2 -->
<button class="limit-card w-full text-left bg-surface-container-low border border-surface-variant rounded-xl p-6 flex items-center justify-between transition-all duration-300 hover:bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-primary-container glow-effect active:scale-[0.98]">
<div class="flex flex-col gap-1">
<span class="font-title-md text-title-md text-on-surface">Juegos de Impacto</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Nalgadas, azotes o dolor físico.</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center shrink-0 check-container relative">
<span class="material-symbols-outlined text-primary-container check-icon absolute" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Card 3 -->
<button class="limit-card w-full text-left bg-surface-container-low border border-surface-variant rounded-xl p-6 flex items-center justify-between transition-all duration-300 hover:bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-primary-container glow-effect active:scale-[0.98]">
<div class="flex flex-col gap-1">
<span class="font-title-md text-title-md text-on-surface">Preguntas Personales</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Temas del pasado o secretos profundos.</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center shrink-0 check-container relative">
<span class="material-symbols-outlined text-primary-container check-icon absolute" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
</main>
<!-- Bottom Action Bar (Transactional Layout) -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-background via-background to-transparent z-50">
<div class="flex items-center gap-md">
<button class="flex-1 py-4 rounded-full border border-outline text-on-surface font-label-lg text-label-lg uppercase tracking-wider transition-colors hover:bg-surface-container-high active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary">
                Atrás
            </button>
<button class="flex-[2] py-4 rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg uppercase tracking-wider shadow-[0_0_20px_rgba(253,78,135,0.3)] transition-transform hover:opacity-90 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary-container">
                Siguiente
            </button>
</div>
</div>
<script>
        document.querySelectorAll('.limit-card').forEach(card => {
            card.addEventListener('click', () => {
                card.classList.toggle('selected');
                const checkContainer = card.querySelector('.check-container');
                if (card.classList.contains('selected')) {
                    checkContainer.classList.remove('border-outline-variant');
                    checkContainer.classList.add('border-primary-container');
                } else {
                    checkContainer.classList.add('border-outline-variant');
                    checkContainer.classList.remove('border-primary-container');
                }
            });
        });
    </script>
