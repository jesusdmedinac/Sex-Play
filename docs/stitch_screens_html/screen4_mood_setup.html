<div class="mb-xl text-center md:text-left mt-md">
<h2 class="font-display-lg text-display-lg text-[#EC407A] drop-shadow-md mb-xs">¿Qué ambiente prefieren hoy?</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto md:mx-0">Seleccionen el ambiente que mejor se adapte a su deseo actual.</p>
</div>
<!-- Input Form (Glassmorphism Card) -->
<div class="flex flex-col gap-4 w-full relative z-20 mb-xl">
<!-- Card 1: Selected -->
<button class="flex items-center justify-between p-md bg-[#EC407A] text-on-primary-container rounded-[32px_12px_32px_12px] shadow-lg transition-all active:scale-95">

</button>

</div>
